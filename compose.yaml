services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paidahead
      POSTGRES_PASSWORD: paidahead_local_only
      POSTGRES_DB: paidahead
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - paidahead_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paidahead -d paidahead"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  paidahead_pg:
